name: Build & Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js 22
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Verify Node/npm
      - name: Verify Node version
        run: |
          node --version
          npm --version

      # 4. Install dependencies
      - name: Install dependencies
        run: npm ci --include=dev --legacy-peer-deps --no-audit --no-fund

      # 5. Install EAS CLI
      - name: Install EAS CLI
        run: npm install --global eas-cli

      # 6. Verify Expo authentication
      - name: Verify Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ERROR: EXPO_TOKEN is not set!"
            exit 1
          fi

          echo "EXPO_TOKEN is set"
          eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # 7. Build Android APK
      - name: Build Android APK
        run: |
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"

      # 8. Get the latest Android build ID
      - name: Get EAS build ID
        run: |
          BUILD_ID=$(eas build:list \
            --platform android \
            --limit 1 \
            --json | jq -r '.[0].id')

          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "ERROR: Could not find EAS build ID"
            exit 1
          fi

          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "EAS Build ID: $BUILD_ID"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # 9. Download APK from EAS
      - name: Download APK
        run: |
          echo "Downloading EAS build: $BUILD_ID"

          DOWNLOAD_OUTPUT=$(eas build:download \
            --build-id "$BUILD_ID" \
            --non-interactive 2>&1)

          echo "$DOWNLOAD_OUTPUT"

          APK=$(echo "$DOWNLOAD_OUTPUT" \
            | grep -oE '/[^[:space:]]+\.apk' \
            | tail -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Could not find APK path in EAS download output."
            exit 1
          fi

          echo "APK downloaded to:"
          echo "$APK"

          cp "$APK" ./app.apk

          echo "APK ready:"
          ls -lh ./app.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # 10. Create GitHub Release
      - name: Release APK on GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./app.apk
          body: |
            # orbi ${{ github.ref_name }}

            ## Installation

            1. Download `app.apk`.
            2. Transfer it to your Android phone.
            3. Enable "Install unknown apps" if Android asks.
            4. Open the APK and install it.

            ## Features

            ✓ Calendar with reminders
            ✓ Finance tracking
            ✓ Project management
            ✓ Goals & learning
            ✓ Nutrition logging

            **Powered by Railway backend**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}