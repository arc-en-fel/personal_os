name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Node.js 22
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Verify Node and npm
      - name: Verify Node version
        run: |
          node --version
          npm --version

      # 4. Install dependencies using package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      # 5. Install EAS CLI
      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Initialize EAS project
        run: eas init --account deepak_bhaskaran --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}

      # 6. Verify Expo token
      - name: Verify Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ERROR: EXPO_TOKEN is not set!"
            exit 1
          else
            echo "EXPO_TOKEN is set"
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # 7. Build Android APK
      - name: Build Android APK
        run: eas build --platform android --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      # 8. Get the latest EAS build ID
      - name: Get EAS build ID
        run: |
          BUILD_ID=$(eas build:list --limit 1 --json | jq -r '.[0].id')
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "Build ID: $BUILD_ID"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # 9. Download APK
      - name: Download APK
        run: |
          echo "Downloading build: $BUILD_ID"
          eas build:download \
            --id "$BUILD_ID" \
            --path ./app.apk \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # 10. Create GitHub Release
      - name: Release APK on GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./app.apk
          body: |
            # Personal Tracker v${{ github.ref_name }}

            ## Installation

            1. Download `app.apk` below.
            2. Transfer it to your Android phone.
            3. Enable "Install unknown apps" for your file manager if required.
            4. Open the APK and install it.

            ## Features

            ✓ Calendar with reminders
            ✓ Finance tracking
            ✓ Project management
            ✓ Goals & learning
            ✓ Nutrition logging

            **Powered by Railway backend**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}