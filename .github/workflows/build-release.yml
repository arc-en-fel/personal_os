name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build APK with EAS
        run: eas build --platform android --non-interactive
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Download APK
        run: |
          BUILD_ID=$(eas build:list --limit 1 --json | jq -r '.[0].id')
          echo "Build ID: $BUILD_ID"
          eas build:download --id "$BUILD_ID" --path ./app.apk --non-interactive

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./app.apk
          body: |
            ## Personal Tracker v${{ github.ref_name }}
            
            ### Installation
            1. Download `app.apk` from assets
            2. Transfer to Android phone
            3. Settings → Apps & notifications → Install unknown apps → Enable
            4. Open APK and tap Install
            
            ### Features
            - Calendar with reminders
            - Finance tracking
            - Project management
            - Goals & learning
            - Nutrition logging
            
            No laptop needed - runs on Railway backend!
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
