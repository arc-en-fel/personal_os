name: EAS OTA Update

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Verify Node/npm
      - name: Verify Node version
        run: |
          node --version
          npm --version

      # 4. Install dependencies
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      # 5. Install EAS CLI
      - name: Install EAS CLI
        run: npm install --global eas-cli

      # 6. Verify Expo authentication
      - name: Verify Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ERROR: EXPO_TOKEN is not set!"
            exit 1
          fi
          echo "EXPO_TOKEN is configured"
          eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # 7. Publish OTA update to production channel
      - name: Publish OTA Update
        run: |
          echo "Publishing OTA update to production channel..."
          
          eas update \
            --platform android \
            --channel production \
            --message "OTA Update from GitHub Actions"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      # 8. Log update completion
      - name: Update published
        run: |
          echo "✓ OTA update published successfully"
          echo "✓ Installed apps will receive the update on next startup"
