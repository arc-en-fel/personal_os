<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#F7F5F0"/>
  
  <!-- Main orbital ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#607A62" stroke-width="12" opacity="0.6"/>
  
  <!-- Secondary orbital ring -->
  <circle cx="256" cy="256" r="100" fill="none" stroke="#B5C9B2" stroke-width="10" opacity="0.4"/>
  
  <!-- Central sphere -->
  <circle cx="256" cy="256" r="45" fill="#607A62"/>
  
  <!-- Accent dot 1 (top) -->
  <circle cx="256" cy="110" r="18" fill="#D8755B"/>
  
  <!-- Accent dot 2 (right) -->
  <circle cx="370" cy="256" r="18" fill="#D8755B"/>
  
  <!-- Accent dot 3 (bottom-left) -->
  <circle cx="165" cy="370" r="18" fill="#B5C9B2"/>
  
  <!-- Inner detail -->
  <circle cx="256" cy="256" r="25" fill="#FFFDF9" opacity="0.7"/>
  
  <!-- Text: orbi -->
  <text x="256" y="430" font-family="Arial, sans-serif" font-size="64" font-weight="bold" text-anchor="middle" fill="#1D2824" letter-spacing="2">orbi</text>
</svg>